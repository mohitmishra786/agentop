version: 2

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy

builds:
  - binary: agentop
    flags:
      - -trimpath
    ldflags: -s -w -X main.Version={{ .Version }} -X main.CommitSHA={{ .Commit }}
    goos:
      - linux
      - freebsd
      - openbsd
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - 386
      - arm
      - ppc64le
    goarm:
      - 6
      - 7
    ignore:
      - goos: windows
        goarm: "6"
      - goos: windows
        goarm: "7"

archives:
  - format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    files:
      - agentop.1
      - LICENSE
      - README.md

nfpms:
  - ids:
      - agentop
    vendor: mohitmishra786
    homepage: "https://github.com/mohitmishra786/agentop"
    maintainer: "Mohit Mishra <mohitmishra786687@gmail.com>"
    description: "Terminal dashboard for AI coding assistant sessions"
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin

homebrew_casks:
  - repository:
      owner: mohitmishra786
      name: homebrew-tap
    commit_author:
      name: "Mohit Mishra"
      email: "mohitmishra786687@gmail.com"
    homepage: "https://github.com/mohitmishra786/agentop"
    description: "Terminal dashboard for AI coding assistant sessions"
    license: "MIT"
    manpages:
      - agentop.1
    skip_upload: auto

signs:
  - artifacts: null
    enabled: false

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

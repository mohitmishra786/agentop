version: 2

env:
  - CGO_ENABLED=0

before:
  hooks:
    - go mod tidy

builds:
  - binary: agentop
    flags:
      - -trimpath
    ldflags: -s -w -X main.Version={{ .Version }} -X main.CommitSHA={{ .Commit }}
    goos:
      - linux
      - freebsd
      - openbsd
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - 386
      - arm
      - ppc64le
    goarm:
      - 6
      - 7
    ignore:
      - goos: windows
        goarm: "6"
      - goos: windows
        goarm: "7"

archives:
  - format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    files:
      - agentop.1
      - LICENSE
      - README.md

nfpms:
  - ids:
      - agentop
    vendor: mohitmishra786
    homepage: "https://github.com/mohitmishra786/agentop"
    maintainer: "Mohit Mishra <mohitmishra786687@gmail.com>"
    description: "Terminal dashboard for AI coding assistant sessions"
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin

# Homebrew formula — auto-pushed to mohitmishra786/homebrew-tap on every release
brews:
  - repository:
      owner: mohitmishra786
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: "Mohit Mishra"
      email: "mohitmishra786687@gmail.com"
    homepage: "https://github.com/mohitmishra786/agentop"
    description: "Terminal dashboard for AI coding assistant sessions — token usage, cost, and cache efficiency"
    license: "MIT"
    install: |
      bin.install "agentop"
      man1.install "agentop.1"
    test: |
      assert_match version.to_s, shell_output("#{bin}/agentop --version")

# AUR binary package — auto-publishes on every release via goreleaser
# Requires AUR_SSH_PRIVATE_KEY secret set in GitHub Actions settings
aurs:
  - name: agentop-bin
    homepage: "https://github.com/mohitmishra786/agentop"
    description: "Terminal dashboard for AI coding assistant sessions"
    maintainers:
      - "Mohit Mishra <mohitmishra786687@gmail.com>"
    license: "MIT"
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/agentop-bin.git"
    provides:
      - agentop
    conflicts:
      - agentop
    package: |-
      install -Dm755 agentop "${pkgdir}/usr/bin/agentop"
      install -Dm644 agentop.1 "${pkgdir}/usr/share/man/man1/agentop.1"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

signs:
  - artifacts: none

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

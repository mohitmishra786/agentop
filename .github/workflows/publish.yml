name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. v1.0.2)"
        required: true
        type: string
      targets:
        description: "Targets to publish (comma-separated: aur,homebrew,scoop)"
        required: true
        default: "aur,homebrew,scoop"
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Download checksums
        run: |
          VERSION="${{ inputs.version }}"
          curl -sL "https://github.com/mohitmishra786/agentop/releases/download/${VERSION}/checksums.txt" -o /tmp/checksums.txt

      - name: Publish AUR
        if: contains(inputs.targets, 'aur')
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          VERSION="${{ inputs.version }}"
          PKGVER="${VERSION#v}"

          # Set up SSH key
          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

          # Clone AUR repo
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -F /dev/null" git clone ssh://aur@aur.archlinux.org/agentop-bin.git /tmp/aur-repo

          # Copy PKGBUILD from agentop repo
          cp packaging/aur/PKGBUILD /tmp/aur-repo/

          # Verify PKGBUILD version matches release
          grep "pkgver=${PKGVER}" /tmp/aur-repo/PKGBUILD || { echo "PKGBUILD version mismatch"; exit 1; }

          # Generate .SRCINFO
          cd /tmp/aur-repo
          cat > .SRCINFO << EOF
pkgbase = agentop-bin
\tpkgdesc = Terminal dashboard for AI coding assistant sessions — token usage, cost, and cache efficiency
\tpkgver = ${PKGVER}
\tpkgrel = 1
\turl = https://github.com/mohitmishra786/agentop
\tinstall =
\tarch = x86_64
\tarch = aarch64
\tlicense = MIT
\tprovides = agentop
\tconflicts = agentop
\tsource_x86_64 = agentop-${PKGVER}-x86_64.tar.gz::https://github.com/mohitmishra786/agentop/releases/download/${VERSION}/agentop_${PKGVER}_linux_x86_64.tar.gz
\tsource_aarch64 = agentop-${PKGVER}-aarch64.tar.gz::https://github.com/mohitmishra786/agentop/releases/download/${VERSION}/agentop_${PKGVER}_linux_arm64.tar.gz
EOF
          # Parse checksums from PKGBUILD
          SHA_X86=$(grep sha256sums_x86_64 PKGBUILD | grep -o "'[^']*'" | tr -d "'")
          SHA_AARCH=$(grep sha256sums_aarch64 PKGBUILD | grep -o "'[^']*'" | tr -d "'")
          cat >> .SRCINFO << EOF
\tsha256sums_x86_64 = ${SHA_X86}
\tsha256sums_aarch64 = ${SHA_AARCH}
EOF

          # Commit and push
          git add PKGBUILD .SRCINFO
          git config user.name "Mohit Mishra"
          git config user.email "mohitmishra786687@gmail.com"
          git commit -m "Update to ${VERSION}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -F /dev/null" git push

      - name: Publish Homebrew
        if: contains(inputs.targets, 'homebrew')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --skip=publish --skip=nfpm --skip=aur --skip=scoop --skip=nix --skip=winget --skip=sign --skip=aur-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Publish Scoop
        if: contains(inputs.targets, 'scoop')
        run: |
          VERSION="${{ inputs.version }}"
          git clone https://x-access-token:${{ secrets.SCOOP_GITHUB_TOKEN }}@github.com/mohitmishra786/scoop-bucket.git /tmp/scoop-bucket
          cd /tmp/scoop-bucket/bucket
          SHA64=$(grep "windows_x86_64.zip" /tmp/checksums.txt | awk '{print $1}')
          SHAARM=$(grep "windows_arm64.zip" /tmp/checksums.txt | awk '{print $1}')
          jq --arg v "${VERSION#v}" \
             --arg sha64 "$SHA64" \
             --arg shaarm "$SHAARM" \
             '.version = $v |
              .architecture."64bit".hash = $sha64 |
              .architecture."arm64".hash = $shaarm |
              .architecture."64bit".url = "https://github.com/mohitmishra786/agentop/releases/download/v\($v)/agentop_\($v)_windows_x86_64.zip" |
              .architecture."arm64".url = "https://github.com/mohitmishra786/agentop/releases/download/v\($v)/agentop_\($v)_windows_arm64.zip"' \
             agentop.json > agentop.json.tmp && mv agentop.json.tmp agentop.json
          git config user.name "Mohit Mishra"
          git config user.email "mohitmishra786687@gmail.com"
          git add agentop.json
          git commit -m "Update agentop to ${VERSION}"
          git push
